# ─── RMASC FACTORY — Auto Deploy Pipeline ─────────────────────────────────
# git push → build → SSH → git pull → restart systemd
name: RMASC Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci && npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '100.73.62.52' }}
          username: ${{ secrets.SERVER_USER || 'sarlrmasc' }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/sarlrmasc/rmasc-erp
            git reset --hard
            git pull origin main
            npm run build
            sudo systemctl restart rmasc-erp
            sleep 3
            curl -s --fail http://localhost:4000/api/health || exit 1

      - run: echo "Deploy OK - https://sarl-rmasc.com"
